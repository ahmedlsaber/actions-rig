name: OIDC Test
on:
  pull_request:
    workflow_dispatch:

    permissions:
      id-token: write

      jobs:
        claims:
            runs-on: ubuntu-latest
                steps:
                      - run: |
                                TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=githubtest" -s)
                                          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | python3 -m json.tool || echo "RAW:$TOKEN"
                                                    echo "event=$GITHUB_EVENT_NAME actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY ref=$GITHUB_REF head_ref=$GITHUB_HEAD_REF"
                                                    
